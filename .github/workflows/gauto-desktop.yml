name: Gauto Desktop

on:
  push:
    paths:
      - 'windows/gauto-desktop/**'
      - '.github/workflows/gauto-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests
        working-directory: windows/gauto-desktop
        run: python tests/test_sync.py
      - name: Install
        working-directory: windows/gauto-desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        working-directory: windows/gauto-desktop
        run: python build_exe.py
      - name: Package
        working-directory: windows/gauto-desktop
        shell: pwsh
        run: Compress-Archive -Path dist/Gauto -DestinationPath Gauto-Desktop-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Gauto-Desktop-win64
          path: windows/gauto-desktop/Gauto-Desktop-win64.zip
